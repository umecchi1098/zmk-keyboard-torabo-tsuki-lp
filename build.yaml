include:
  # Zephyr 4.1では、ボード名に使用するSoCのqualifierを明示します。
  # ZMKとの互換性は、このリポジトリ直下のKconfigで宣言しています。
  - artifact: torabo_tsuki_lp_left_peripheral
    board: bmp_boost/nrf52840
    shield: torabo_tsuki_lp_left
    snippets:
      - studio-rpc-usb-uart
  - artifact: torabo_tsuki_lp_right_central
    board: bmp_boost/nrf52840
    shield: torabo_tsuki_lp_right
    snippets:
      - studio-rpc-usb-uart
      - split-central
      - input-trackball
      - input-listener
  # Studio機能の開発・診断時だけ使用する、Lock無効版です。
  # 通常運用では上の本番用right_centralを使用してください。
  - artifact: torabo_tsuki_lp_right_central_develop
    board: bmp_boost/nrf52840
    shield: torabo_tsuki_lp_right
    snippets:
      - studio-rpc-usb-uart
      - split-central
      - input-trackball
      - input-listener
    cmake-args: -DCONFIG_ZMK_STUDIO_LOCKING=n
  # 左右両方にポインターを搭載する場合だけ使用する、double-ball構成です。
  - artifact: torabo_tsuki_lp_double_ball_left_peripheral
    board: bmp_boost/nrf52840
    shield: torabo_tsuki_lp_left
    snippets:
      - studio-rpc-usb-uart
      # 左側の入力は加工せず、Split経由で右Centralへ送ります。
      - input-trackball
      - input-split
  - artifact: torabo_tsuki_lp_double_ball_right_central
    board: bmp_boost/nrf52840
    shield: torabo_tsuki_lp_right
    snippets:
      - studio-rpc-usb-uart
      - split-central
      - input-trackball
      - input-listener
      # 左Peripheralから届いた入力を、左用Runtime Processorへ渡します。
      - input-split-listener
  - artifact: settings_reset-bmp_boost-zmk
    board: bmp_boost/nrf52840
    shield: settings_reset
    # ボードvariant変更後も、利用者が探す成果物名は従来どおりに保ちます。
