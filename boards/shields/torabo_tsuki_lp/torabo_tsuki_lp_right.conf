CONFIG_ZMK_STUDIO=y
# 本番ファームウェアではStudio Lockを既定の有効状態にします。
# 開発用だけbuild.yamlのcmake-argsからLockを無効化します。

# DYA Studioで既定キーマップとの差分を高速に読み取ります。
CONFIG_ZMK_FAST_KEYMAP=y
CONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=y
CONFIG_ZMK_FAST_KEYMAP_DEFAULT_LAYER=y

# キー以外の物理デバイスをDYA Studioのレイアウトへ表示します。
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE=y
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE_STUDIO_RPC=y

# 左右の設定をDYA Studioから扱うCustom Settings基盤です。
# Studio RPCはホストと接続する右Centralだけで有効にします。
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y

# 後続フェーズのMacro、Combo、Input Processorが使う型を明示的に有効化します。
# 上流の既定値が変わっても、必要な機能が意図せず消えないようにします。
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUES=y
CONFIG_ZMK_CUSTOM_SETTINGS_ARRAY=y
CONFIG_ZMK_CUSTOM_SETTINGS_KEYSPACE=y
CONFIG_ZMK_CUSTOM_SETTINGS_RPC_CONVERTERS=y
CONFIG_ZMK_CUSTOM_SETTINGS_RECORD=y
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# DYA StudioでMacroを作成・編集し、&rmacroのslotとして実行します。
# 8個のMacroで1,024バイトを共有し、1個あたりの最大値は256バイトです。
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_MACRO_COUNT=8
CONFIG_ZMK_RUNTIME_MACRO_NAME_MAX_LEN=24
CONFIG_ZMK_RUNTIME_MACRO_POOL_BYTES=1024
CONFIG_ZMK_RUNTIME_MACRO_MAX_BYTES=256
CONFIG_ZMK_RUNTIME_MACRO_QUEUE_SIZE=64
CONFIG_ZMK_RUNTIME_MACRO_DEFAULT_TAP_MS=30

# DYA Studioから追加のComboを最大8個まで管理します。
# 既存のBluetooth Clear Comboは従来のDevicetree定義として別に維持します。
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_COMBO_MAX_COMBOS=8
CONFIG_ZMK_RUNTIME_COMBO_MAX_POSITIONS_PER_COMBO=16
CONFIG_ZMK_RUNTIME_COMBO_DEFAULT_TIMEOUT_MS=50
CONFIG_ZMK_RUNTIME_COMBO_DEFAULT_REQUIRE_PRIOR_IDLE_MS=0

# トラックボールの感度、回転、反転、自動Mouse、ScrollをDYA Studioから変更します。
# double-ball版では最大4つのProcessorを通知するため、下部の低優先度スタックは4096バイトを維持します。
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# DYA Studioの「接続」画面から、BLEプロファイルとUSB／BLEの優先順位を管理します。
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# 接続先ごとの既定レイヤーをDYA Studioから設定します。
# BaseとmacOSだけを対象にし、Mouseなどの機能レイヤーを誤指定できないようにします。
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_MIN_INDEX=0
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=1
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y

# USB／BLEの通信パターンからOSを推定し、Default LayerのOS別設定へ渡します。
# OS Detection自身のLayer Auto Switchは、Default Layerと競合するため有効化しません。
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER_OS_DETECTION=y

# MacroとComboから参照するbehavior IDを、順序変更に強いCRC16形式にします。
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y

# Unlock後に明示的に開始した場合だけ、押下位置とレイヤー変更を通知します。
# 配信中のUSB切断は避け、DYA Studioで停止してから切断してください。
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y
CONFIG_ZMK_INPUT_STREAM_NOTIF_QUEUE_SIZE=8

# DYA Studioの「設定」画面から、左右のIdleとDeep Sleepの時間を管理します。
# 右Centralが画面との通信を担当し、変更値はSplit Relayで左Peripheralへ同期します。
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# 現行DYA2と同じ240バイトにし、BLE分割通信の範囲内で余裕を確保します。
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240

# Custom Studio RPCと将来の大きな設定要求に合わせてバッファを拡張します。
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256

# Split Relayと設定一覧通知でスタック不足にならないよう、DYA2実績値を使用します。
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000

# 設定保存の待ち時間を10秒へ短縮し、保存前の電源断による消失リスクを抑えます。
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_CDC_ACM_BOOTLOADER_TRIGGER=y
CONFIG_ZMK_STATUS_LED=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=9000000
CONFIG_ZMK_NON_LIPO_MIN_MV=1000
CONFIG_ZMK_NON_LIPO_LOW_MV=900

# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
