CONFIG_ZMK_STUDIO=y

# 左Peripheralが所有する設定を右CentralのDYA Studioへ安全に中継します。
# Studio RPC本体はCentralだけに入れ、Peripheralには中継処理だけを入れます。
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

# 後続フェーズで左側に設定項目を追加しても同じ型を利用できるようにします。
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUES=y
CONFIG_ZMK_CUSTOM_SETTINGS_ARRAY=y
CONFIG_ZMK_CUSTOM_SETTINGS_KEYSPACE=y
CONFIG_ZMK_CUSTOM_SETTINGS_RPC_CONVERTERS=y
CONFIG_ZMK_CUSTOM_SETTINGS_RECORD=y

# 現行DYA2と同じ240バイトにし、BLE分割通信の範囲内で余裕を確保します。
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240

# 設定保存の待ち時間を10秒へ短縮し、保存前の電源断による消失リスクを抑えます。
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# 設定一覧の通知を組み立てる低優先度処理用のスタックです。
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_CDC_ACM_BOOTLOADER_TRIGGER=y
CONFIG_ZMK_STATUS_LED=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=9000000
CONFIG_ZMK_NON_LIPO_MIN_MV=1000
CONFIG_ZMK_NON_LIPO_LOW_MV=900

CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
